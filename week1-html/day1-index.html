<!doctype html>
<!-- 文档类型声明:告诉浏览器这是一个 HTML5 文档,必须有 -->
<html lang="zh-CN">
  <!-- 根元素 lang 属性:帮助浏览器和读屏器识别语言,中文页面用 zh-CN -->
  <head>
    <!-- head 内是"用户看不见"的配置信息 -->
    <meta charset="UTF-8" />
    <!-- 字符编码:UTF-8 支持中文,防止乱码,必须有 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- 视口设置:让页面在手机上正常显示,响应式必备 -->
    <meta name="description" content="我的第一个前端练习页面" />
    <!-- 页面描述:搜索引擎会用到,SEO 基础 -->
    <title>Ray</title>
    <!-- 标题:显示在浏览器标签页上 -->
  </head>
  <body>
    <!-- body 内是用户在页面上能看到的全部内容 -->

    <h1>Hello, I'm Ray</h1>
    <!-- h1 是一级标题,一页只用一个,表示最重要的内容 -->

    <p>这是我用 VS Code 写的第一个网页。</p>
    <!-- p 是段落标签,放普通文字 -->

    <hr />
    <!-- 水平分隔线,单标签不需要闭合 -->

    <h2>今日练习</h2>
    <p>试着修改下面的内容,保存后浏览器会自动刷新(需要 Live Server 插件)。</p>

    <ul>
      <!-- 无序列表 -->
      <li>把上面的标题改成你的名字</li>
      <li>再加一段话介绍你自己</li>
      <li>把页面标题(title)也改一下</li>
      <li>改过了</li>
    </ul>

    <!-- 
      动手任务:
      1. 修改 h1 里的文字
      2. 在 ul 里再加一个 li
      3. 保存(Ctrl+S),看浏览器自动刷新
      4. 改完后在终端执行:git add . ; git commit -m "day1 hello world"
    -->
  </body>
</html>
